[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "power-supply-analytics"
version = "0.2.0"
description = "Engineering diagnostics, spectral analysis, and data correlation for precision power supplies."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Byron Jordan" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "Pillow>=10",
  "reportlab>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
gui = [
  "PySide6>=6.8",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::DeprecationWarning",
]

[tool.setuptools]
packages = ["power_supply_analytics_data"]
py-modules = [
  "cdcu_dcbus_fft",
  "cdcu_diagnostics",
  "cdcu_load_map",
  "cdcu_monitor",
  "cdcu_pmm",
  "cdcu_pmm_fft",
  "cdcu_registers",
  "cdcu_ripple_analyzer",
  "cdcu_ripple_bands",
  "cdcu_ripple_io",
  "cdcu_ripple_pdf",
  "cdcu_ripple_psd",
  "cdcu_scope_fft",
  "magnet_load_diagnostics",
  "one_liners",
  "psa_gui_config",
  "power_supply_analytics_gui",
]

[project.scripts]
power-supply-analytics = "power_supply_analytics_gui:main"

[tool.setuptools.package-data]
power_supply_analytics_data = ["*.json"]
